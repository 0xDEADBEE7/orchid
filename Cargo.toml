[package]
name = "orchid"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3.0"

[[test]]
name = "client"
path = "test/client.rs"

[[test]]
name = "cli"
path = "test/cli.rs"

[[test]]
name = "hooks"
path = "test/unit/hooks.rs"

[[test]]
name = "provider"
path = "test/unit/provider.rs"

[[test]]
name = "store"
path = "test/unit/store.rs"

[[test]]
name = "tools"
path = "test/unit/tools.rs"
